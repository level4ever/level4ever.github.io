name: Site

on:
  push:
  pull_request:
  workflow_dispatch:
  # Rebuilds with QuestieDB's latest corrections every week.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build quest data from QuestieDB
        run: npm run data
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # Publishes main to GitHub Pages (Settings > Pages > Source: GitHub Actions).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
